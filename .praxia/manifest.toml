[plugin]
# Skills reach Claude Code only via the cisternal plugin bundle (<plugin>:<skill>);
# skip praxia's legacy copy into ~/.claude/skills, which duplicated every listing.
skills_delivered_by_plugin = true
name = "cisternal"
version = "0.1.6"  # keep equal to pyproject [project].version (tests/test_self_manifest_version.py)
description = "Agent-asset export CLI — dogfood manifest for M4 Export Trust"
requires_praxia = "0.0.0"

[[plugin.skills]]
name = "export-trust"
path = ".praxia/skills/export-trust/SKILL.md"

[[plugin.skills]]
name = "run-cisternal"
path = ".praxia/skills/run-cisternal/SKILL.md"

[[plugin.skills]]
name = "customizing-tools"
path = ".praxia/skills/customizing-tools/SKILL.md"

[[plugin.skills]]
name = "writing-skill-triggers"
path = ".praxia/skills/writing-skill-triggers/SKILL.md"

[[plugin.skills]]
name = "triage-tool"
path = ".praxia/skills/triage-tool/SKILL.md"

[[plugin.skills]]
name = "developing-in-shadow"
path = ".praxia/skills/developing-in-shadow/SKILL.md"

[[plugin.agents]]
name = "validate-helper"
path = ".praxia/agents/validate-helper.md"
description = "Documents validate, inspect, and export CLI usage"
tools = []

[[plugin.workflows]]
name = "export-dogfood"
path = ".praxia/workflows/export-dogfood.toml"

[families]
bathos_query = ["bathos/run_sql", "bathos/get_run", "bathos/validate_sidecar"]
contemplex_brainstorm = ["contemplex/brainstorm_start", "contemplex/brainstorm_reply", "contemplex/brainstorm_finalize"]
myxcel_slurm = ["myxcel/job_status", "myxcel/list_jobs", "myxcel/job_logs"]

[verbs.bathos]
binary = "bth"
subcommands = { sql = "bathos/run_sql", show = "bathos/get_run", validate-sidecar = "bathos/validate_sidecar" }
tool_family = "bathos_query"
global_flags_with_value = []
exclude = ["run"]

[verbs.contemplex]
binary = "ctxp"
subcommands = { start = "contemplex/brainstorm_start", reply = "contemplex/brainstorm_reply", finalize = "contemplex/brainstorm_finalize" }
tool_family = "contemplex_brainstorm"
global_flags_with_value = []
exclude = []

[verbs.myxcel]
binary = "myxcel"
subcommands = { status = "myxcel/job_status", list = "myxcel/list_jobs", logs = "myxcel/job_logs" }
tool_family = "myxcel_slurm"
global_flags_with_value = []
exclude = ["submit", "cancel"]

[[plugin.hook_specs]]
event = "PreToolUse"
matcher = "Bash"
script = "cisternal-hook pre-tool-use"
tier = "essential"
surfaces = ["claude"]

[[plugin.hook_specs]]
event = "PostToolUse"
matcher = "mcp__.*"
script = "cisternal-hook post-tool-use"
tier = "essential"
surfaces = ["claude"]

