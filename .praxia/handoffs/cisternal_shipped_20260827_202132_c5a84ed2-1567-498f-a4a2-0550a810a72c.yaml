failed_attempts:
- attempt_id: a1
  description: capture_git_state()'s dirty_content_id used a bare `git write-tree` (no throwaway index) against the real repo index to get a content-addressable id for a dirty working tree
  outcome: A test asserting two different uncommitted edits at the same commit produce different dirty_content_id values failed -- both edits produced the identical tree OID
  reason_failed: git write-tree operates on the current INDEX, not the working directory; an edit that was never `git add`ed leaves the index (and thus the tree OID) unchanged regardless of what the working tree actually contains. Fixed by mirroring myxcel's algorithm -- copy the real index to a temp file, set GIT_INDEX_FILE to it, `git add -A` into the throwaway index, then write-tree against that.
  do_not_retry: true
  evidence_ref: tests/test_telemetry_git_state.py::test_dirty_content_id_distinguishes_different_dirty_states
- attempt_id: a2
  description: Stored captured git state in a ContextVar (git_state_var), matching every other piece of context in telemetry/context.py (session_id_var, task_id_var, etc.), set once by init_pipeline() on whichever thread called init()
  outcome: A Record built by _build_record() on a DIFFERENT thread than the one that called init() had None git fields, even though init() had already run and captured real git state
  reason_failed: ContextVars are thread/task-local by design -- correct for per-request context that must stay isolated, wrong for a process-global constant like git state. A ContextVar.set() in one thread's context is invisible to code running in any other thread's context. Fixed by using a plain module-level global (get_git_state()/_set_git_state()) instead, mirroring pipeline.py's own _global_pipeline pattern.
  do_not_retry: true
  evidence_ref: tests/test_core.py::TestGitProvenanceWiring::test_git_state_visible_from_a_different_thread
- attempt_id: a3
  description: Captured git state synchronously inside init_pipeline()'s critical section, before starting the heartbeat thread
  outcome: Several heartbeat-timing tests in test_selfcheck.py started failing (heartbeat_alive=False when expected True, listener-death-detection false negatives) when running the git-provenance changes alongside the existing suite
  reason_failed: capture_git_state() measured ~70ms in a dirty repo (multiple git subprocess spawns); doing this synchronously inside init_pipeline() delayed heartbeat-thread startup enough to blow past the tight sleep windows several timing-sensitive tests assume. Fixed by running the capture in a background daemon thread instead, so init_pipeline() returns promptly; a Record built before the background capture completes just gets None git fields (a valid, already-designed degraded state per AC-4).
  do_not_retry: true
  evidence_ref: tests/test_core.py::TestGitProvenanceWiring::test_init_returns_promptly_despite_background_capture
- attempt_id: a4
  description: In test_modules_importable_with_fastmcp_masked, forced a fresh module import via `sys.modules.pop(module_name, None)` to test importability with fastmcp masked
  outcome: 4 tests in tests/test_export_registry.py and tests/test_export_write.py failed intermittently, ONLY when running the full test suite (never in isolation) -- monkeypatch.setattr calls in those files appeared to silently no-op
  reason_failed: A bare sys.modules.pop() is never undone (no monkeypatch tracking), permanently swapping sys.modules[module_name] for a fresh module object for the rest of the test session. Worse: even after switching to monkeypatch.delitem (which DOES correctly revert the sys.modules dict entry at teardown), the bug persisted -- because monkeypatch.setattr("dotted.path", ...) resolves its target via ATTRIBUTE-WALKING from the top-level package (_pytest.monkeypatch.resolve: __import__ + getattr chain), never consulting sys.modules. The parent package's submodule attribute (e.g. cisternal.export's own .registry attribute) gets set to the fresh module as an unavoidable side effect of import machinery and is never reverted by anything, so it silently diverges from the (correctly-reverted) sys.modules entry -- any later monkeypatch.setattr on that dotted path patches the orphaned fresh module while already-imported code (bound at other files' own collection time) keeps using the stale, unpatched original.
  do_not_retry: true
  evidence_ref: tests/test_cli_assets.py::test_modules_importable_with_fastmcp_masked (see its full docstring)
- attempt_id: a5
  description: Fixed a4 by capturing the parent package's original submodule attribute, then using monkeypatch.setattr(parent, submodule_attr, original_attr) to restore it
  outcome: Still failed -- identical symptom to a4, confirmed with a minimal 2-test repro isolating just this mechanism
  reason_failed: monkeypatch.setattr doesn't just set the value -- it ALSO schedules its OWN teardown to revert back to whatever was there at the moment of THIS call (the orphaned fresh module), undoing the "restore" the instant the test's own monkeypatch fixture tears down. The fix must use a plain setattr() (untracked by monkeypatch) for this specific restoration, since it needs to be permanent, not itself reverted.
  do_not_retry: true
  evidence_ref: tests/test_cli_assets.py::test_modules_importable_with_fastmcp_masked (see its full docstring)
